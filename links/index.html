<!doctype html><html lang=en><head><meta charset=utf-8><meta content="width=device-width,initial-scale=1" name=viewport><title>Links | Claudio Bastiani-Fonck | Personal Website</title><meta content="Personal website and blog." name=description><link href=https://claudio-bf.github.io/css/site.css rel=stylesheet><link title="Claudio Bastiani-Fonck | Personal Website" href=https://claudio-bf.github.io/atom.xml rel=alternate type=application/atom+xml><body><header class=site-header><nav aria-label="Back navigation" class="site-nav site-nav--tree"><a class=nav-action href=https://claudio-bf.github.io/>← Back</a><div aria-current=page class=nav-path><span class=nav-current>Links</span></div></nav></header><main class=content><div class=pw data-payload=https://claudio-bf.github.io/_protected/links.json id=pw><form autocomplete=off class=pw-form><label class=pw-label for=pw-input>Password</label><input autofocus class=pw-input id=pw-input required type=password><button class=pw-btn>Unlock</button><p class=pw-hint hidden><p class=pw-err hidden></form></div><div hidden id=secret></div><script type=module>const $ = (sel, root = document) => root.querySelector(sel);
    const box = $("#pw");
    const form = $(".pw-form", box);
    const input = $("#pw-input", box);
    const hintEl = $(".pw-hint", box);
    const errEl = $(".pw-err", box);
    const secret = $("#secret");

    const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
    const utf8 = new TextDecoder();
    const PAYLOAD_URL = box.dataset.payload;

    const loadPayload = async () => {
      const r = await fetch(PAYLOAD_URL, {cache: "no-store"});
      if (!r.ok) throw new Error(`Failed to load encrypted payload (${r.status})`);
      return r.json();
    };

    const deriveKey = async (password, saltB64, iterations) => {
      const baseKey = await crypto.subtle.importKey(
        "raw",
        new TextEncoder().encode(password),
        {name: "PBKDF2"},
        false,
        ["deriveKey"],
      );
      return crypto.subtle.deriveKey(
        {name: "PBKDF2", salt: b64(saltB64), iterations, hash: "SHA-256"},
        baseKey,
        {name: "AES-GCM", length: 256},
        false,
        ["decrypt"],
      );
    };

    let payload;
    try {
      payload = await loadPayload();
      if (payload?.hint) {
        hintEl.textContent = `Hint: ${payload.hint}`;
        hintEl.hidden = false;
      }
    } catch (e) {
      errEl.textContent = String(e?.message || e);
      errEl.hidden = false;
      form.querySelector("button").disabled = true;
    }

    form.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      errEl.hidden = true;
      const password = input.value;
      if (!password || !payload) return;

      input.disabled = true;
      form.querySelector("button").disabled = true;

      try {
        const key = await deriveKey(password, payload.kdf.salt, payload.kdf.iter);
        const pt = await crypto.subtle.decrypt(
          {name: "AES-GCM", iv: b64(payload.cipher.iv), tagLength: payload.cipher.tagLength},
          key,
          b64(payload.ct),
        );

        secret.innerHTML = utf8.decode(new Uint8Array(pt));
        secret.hidden = false;
        box.hidden = true;
      } catch {
        errEl.textContent = "Wrong password.";
        errEl.hidden = false;
        input.disabled = false;
        form.querySelector("button").disabled = false;
        input.select();
      }
    });</script></main>
